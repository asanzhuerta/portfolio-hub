# Netlify detects Next.js and applies its runtime (OpenNext) automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Read from disk by the Open Graph image routes (lib/og.tsx).
[functions]
  included_files = ["assets/fonts/*.ttf", "public/*.svg", "public/projects/*/*.svg", "public/projects/*/og.png"]
